<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker News — Reimagined</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --sky-0:#000810;--sky-1:#001219;--sky-2:#005f73;--sky-3:#0a9396;--sky-4:#94d2bd;
            --accent:#00ffb3;--accent-alt:#0a9396;--text:#94d2bd;
            --card:rgba(0,8,16,0.7);--card-hover:rgba(0,255,179,0.1);--border:rgba(0,255,179,0.15);
            --particle:rgba(0,255,179,1);--bird-color:#001219;
            --mtn1:rgba(0,8,16,0.95);--mtn2:rgba(0,18,25,0.7);--mtn3:rgba(0,95,115,0.2);
            --glow:rgba(0,255,179,0.15);--expanded-bg:rgba(0,8,16,0.85);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Space Grotesk',sans-serif;background:var(--sky-0);color:var(--text);overflow-x:hidden;}
        ::-webkit-scrollbar{width:6px;}
        ::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;}

        .parallax-container{position:fixed;inset:0;z-index:0;overflow:hidden;}
        .sky-layer{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-0) 0%,var(--sky-1) 25%,var(--sky-2) 50%,var(--sky-3) 75%,var(--sky-4) 100%);transition:all 2.5s ease;}
        .stars-layer{position:absolute;inset:0;transition:opacity 2s ease;}
        .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s);}
        @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8);}50%{opacity:1;transform:scale(1.2);}}
        .shooting-star{position:absolute;width:80px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.8),transparent);transform:rotate(-35deg);animation:shoot 4s ease-in infinite;opacity:0;}
        @keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-35deg);}5%{opacity:1;}15%{opacity:0;transform:translate(-300px,180px) rotate(-35deg);}100%{opacity:0;}}

        .cloud{position:absolute;color:rgba(255,255,255,.12);animation:drift linear infinite;}
        @keyframes drift{from{transform:translateX(-300px);}to{transform:translateX(calc(100vw + 300px));}}

        .mountain-layer{position:absolute;bottom:0;left:0;width:100%;transition:fill 2.5s ease;will-change:transform;}
        .mtn-1{height:45%;}.mtn-2{height:35%;}.mtn-3{height:22%;}

        .birds-layer{position:absolute;inset:0;will-change:transform;}
        .bird-fly{position:absolute;animation:flyAcross linear infinite;}
        @keyframes flyAcross{from{transform:translateX(-120px);}to{transform:translateX(calc(100vw + 120px));}}
        .bird-flap{animation:flap ease-in-out infinite;}
        @keyframes flap{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.25);}}

        #particle-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;}

        .grain{position:fixed;inset:0;z-index:99;pointer-events:none;opacity:.035;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}

        .content{position:relative;z-index:10;}

        .site-header{position:fixed;top:0;left:0;right:0;z-index:50;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px);background:rgba(0,0,0,.2);border-bottom:1px solid var(--border);transition:all 2s ease;}
        .logo{font-weight:900;font-size:1.3rem;letter-spacing:-.02em;color:var(--accent);transition:color 2s ease;}
        .logo span{font-weight:300;color:var(--text);margin-left:.3rem;transition:color 2s ease;}
        .weather-badge{display:flex;align-items:center;gap:.6rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;padding:.4rem .9rem;border-radius:100px;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(10px);transition:all 2s ease;}
        .weather-badge i{color:var(--accent);transition:color 2s ease;}

        .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;}
        .hero-title{font-size:clamp(3rem,10vw,8rem);font-weight:900;letter-spacing:-.04em;line-height:.95;color:var(--accent);text-shadow:0 0 80px var(--glow),0 0 160px var(--glow);transition:all 2s ease;}
        .hero-sub{font-size:clamp(.9rem,2vw,1.2rem);font-weight:300;margin-top:1.2rem;opacity:.7;max-width:500px;transition:color 2s ease;}
        .scroll-indicator{position:absolute;bottom:2rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;opacity:.5;animation:bob 2s ease-in-out infinite;}
        .scroll-indicator span{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;}
        @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(8px);}}

        .news-section{max-width:820px;margin:0 auto;padding:4rem 1.5rem 8rem;}
        .section-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2rem;display:flex;align-items:center;gap:.8rem;transition:color 2s ease;}
        .section-label::after{content:'';flex:1;height:1px;background:var(--border);transition:background 2s ease;}

        /* Story card */
        .story-card{border-radius:14px;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(12px);margin-bottom:.75rem;opacity:0;transform:translateY(30px);transition:all .6s cubic-bezier(.16,1,.3,1),background .3s ease,border-color .3s ease,box-shadow .3s ease;overflow:hidden;cursor:pointer;}
        .story-card.visible{opacity:1;transform:translateY(0);}
        .story-card:hover{border-color:color-mix(in srgb, var(--accent) 50%, transparent);box-shadow:0 0 30px var(--glow);}
        .story-card.visible:hover{transform:translateY(0);}

        .story-header{display:flex;align-items:flex-start;gap:1.2rem;padding:1.2rem 1.5rem;transition:background .3s ease;}
        .story-card:hover .story-header{background:var(--card-hover);}

        .story-rank{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:1.1rem;color:var(--accent);min-width:2.5rem;text-align:right;padding-top:.15rem;transition:color 2s ease;flex-shrink:0;}
        .story-body{flex:1;min-width:0;}
        .story-title-text{font-size:1rem;font-weight:600;line-height:1.4;margin-bottom:.4rem;transition:color .2s;}
        .story-card:hover .story-title-text{color:var(--accent);}
        .story-meta{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;opacity:.6;}
        .story-meta i{margin-right:.25rem;font-size:.6rem;}
        .story-domain{color:var(--accent);opacity:.8;}

        .story-expand-icon{color:var(--accent);opacity:0;transform:rotate(-90deg);transition:all .35s cubic-bezier(.16,1,.3,1);padding-top:.25rem;flex-shrink:0;font-size:.85rem;}
        .story-card:hover .story-expand-icon{opacity:.7;}
        .story-card.expanded .story-expand-icon{opacity:1;transform:rotate(0deg);}

        /* Expanded preview */
        .story-expanded{max-height:0;overflow:hidden;transition:max-height .6s cubic-bezier(.16,1,.3,1),opacity .4s ease;opacity:0;}
        .story-card.expanded .story-expanded{max-height:600px;opacity:1;}

        .story-expanded-inner{padding:0 1.5rem 1.5rem;display:flex;gap:1.5rem;align-items:flex-start;}
        .story-image-wrap{width:220px;height:160px;border-radius:10px;overflow:hidden;flex-shrink:0;position:relative;background:var(--border);}
        .story-image-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
        .story-image-wrap:hover img{transform:scale(1.05);}
        .story-image-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;opacity:.4;font-size:.75rem;font-family:'JetBrains Mono',monospace;}
        .story-image-placeholder i{font-size:1.8rem;}

        .story-preview-text{flex:1;min-width:0;}
        .story-preview-text p{font-size:.88rem;line-height:1.7;opacity:.75;margin-bottom:1rem;}
        .story-visit-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.4rem;border-radius:100px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-family:'Space Grotesk',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .3s ease;text-decoration:none;}
        .story-visit-btn:hover{background:var(--accent);color:var(--sky-0);box-shadow:0 0 20px var(--glow);}
        .story-visit-btn i{font-size:.7rem;transition:transform .3s ease;}
        .story-visit-btn:hover i{transform:translateX(3px);}

        .story-preview-loading{display:flex;align-items:center;gap:.8rem;padding:1rem 0;opacity:.5;font-size:.8rem;}
        .story-preview-loading .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}

        .story-preview-error{padding:.8rem 0;font-size:.8rem;opacity:.5;}

        .expand-divider{height:1px;background:var(--border);margin:0 1.5rem;transition:background 2s ease;}

        /* Skeleton */
        .skeleton-card{display:flex;align-items:flex-start;gap:1.2rem;padding:1.2rem 1.5rem;border-radius:14px;border:1px solid var(--border);background:var(--card);margin-bottom:.75rem;}
        .skel-bar{border-radius:4px;background:linear-gradient(90deg,var(--card) 25%,var(--border) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s ease infinite;}
        @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

        .time-switcher{position:fixed;bottom:1.5rem;right:1.5rem;z-index:50;display:flex;gap:.4rem;padding:.4rem;border-radius:100px;background:rgba(0,0,0,.5);backdrop-filter:blur(16px);border:1px solid var(--border);}
        .time-btn{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;justify-content:center;font-size:.7rem;background:transparent;color:var(--text);}
        .time-btn:hover{transform:scale(1.2);}
        .time-btn.active{background:var(--accent);color:var(--sky-0);box-shadow:0 0 15px var(--glow);}

        .site-footer{text-align:center;padding:2rem;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:.3;border-top:1px solid var(--border);}

        .toast{position:fixed;top:5rem;left:50%;transform:translateX(-50%) translateY(-20px);z-index:100;padding:.7rem 1.5rem;border-radius:100px;background:var(--card);border:1px solid var(--accent);backdrop-filter:blur(16px);font-size:.8rem;opacity:0;transition:all .4s ease;pointer-events:none;}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

        @media(max-width:640px){
            .site-header{padding:.8rem 1rem;}
            .weather-badge .badge-temp,.weather-badge .badge-desc{display:none;}
            .story-header{padding:1rem;gap:.8rem;}
            .story-rank{min-width:2rem;font-size:.9rem;}
            .story-expanded-inner{flex-direction:column;padding:0 1rem 1rem;}
            .story-image-wrap{width:100%;height:180px;}
            .time-switcher{bottom:1rem;right:1rem;}
            .time-btn{width:28px;height:28px;font-size:.6rem;}
        }
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
    </style>
</head>
<body>
    <div class="grain"></div>
    <div class="parallax-container" id="parallax-bg">
        <div class="sky-layer" id="sky-layer"></div>
        <div class="stars-layer" id="stars-layer"></div>
        <div id="clouds-layer" style="position:absolute;inset:0;overflow:hidden;"></div>
        <svg class="mountain-layer mtn-1" id="mtn1" viewBox="0 0 1440 400" preserveAspectRatio="none"><path fill="var(--mtn1)" d="M0,180 L80,120 L180,160 L300,70 L420,140 L540,40 L660,110 L780,30 L900,130 L1020,50 L1140,120 L1260,60 L1380,140 L1440,100 L1440,400 L0,400Z"/></svg>
        <svg class="mountain-layer mtn-2" id="mtn2" viewBox="0 0 1440 400" preserveAspectRatio="none"><path fill="var(--mtn2)" d="M0,240 L100,180 L220,220 L380,130 L520,200 L680,110 L820,190 L960,120 L1100,200 L1240,140 L1440,210 L1440,400 L0,400Z"/></svg>
        <svg class="mountain-layer mtn-3" id="mtn3" viewBox="0 0 1440 400" preserveAspectRatio="none"><path fill="var(--mtn3)" d="M0,300 L120,260 L260,290 L400,240 L540,280 L700,250 L840,290 L1000,260 L1160,285 L1300,255 L1440,280 L1440,400 L0,400Z"/></svg>
        <div class="birds-layer" id="birds-layer"></div>
    </div>
    <canvas id="particle-canvas"></canvas>

    <div class="content">
        <header class="site-header">
            <div class="logo">HN<span>reimagined</span></div>
            <div class="weather-badge" id="weather-badge">
                <i class="fas fa-moon" id="weather-icon"></i>
                <span class="badge-temp" id="badge-temp">8°C</span>
                <span class="badge-desc" id="badge-desc">Starry digital night</span>
                <span id="badge-time" style="opacity:.6;"></span>
            </div>
        </header>

        <section class="hero">
            <h1 class="hero-title">HACKER<br>NEWS</h1>
            <p class="hero-sub" id="hero-sub">Tap any story to preview it — the link appears once you've seen enough</p>
            <div class="scroll-indicator">
                <span>Scroll</span>
                <i class="fas fa-chevron-down" style="color:var(--accent);"></i>
            </div>
        </section>

        <section class="news-section">
            <div class="section-label"><i class="fas fa-bolt"></i> Top Stories</div>
            <div id="stories-container"></div>
        </section>

        <footer class="site-footer">
            Powered by Hacker News API &middot; Previews via r.jina.ai &middot; Colors shift with time
        </footer>
    </div>

    <div class="time-switcher" id="time-switcher">
        <button class="time-btn" data-period="dawn" title="Dawn" aria-label="Switch to dawn theme"><i class="fas fa-sun"></i></button>
        <button class="time-btn" data-period="morning" title="Morning" aria-label="Switch to morning theme"><i class="fas fa-cloud-sun"></i></button>
        <button class="time-btn" data-period="afternoon" title="Afternoon" aria-label="Switch to afternoon theme"><i class="fas fa-sun"></i></button>
        <button class="time-btn" data-period="evening" title="Evening" aria-label="Switch to evening theme"><i class="fas fa-cloud-moon"></i></button>
        <button class="time-btn active" data-period="night" title="Night" aria-label="Switch to night theme"><i class="fas fa-moon"></i></button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    /* ===================== THEMES ===================== */
    const themes = {
        dawn: {
            sky:['#1a0a2e','#4a1942','#c84b31','#f5a623','#fcd34d'],
            accent:'#f5a623',accentAlt:'#c84b31',text:'#fcd34d',
            card:'rgba(74,25,66,0.55)',cardHover:'rgba(200,75,49,0.3)',
            border:'rgba(245,166,35,0.2)',particle:'rgba(252,211,77,1)',
            birdColor:'#4a1942',mtn1:'rgba(26,10,46,0.8)',mtn2:'rgba(74,25,66,0.55)',mtn3:'rgba(200,75,49,0.25)',
            glow:'rgba(245,166,35,0.15)',icon:'fa-cloud-sun',temp:'12°C',desc:'Dawn mist rising',showStars:false,showClouds:true
        },
        morning: {
            sky:['#0a1628','#0f2b3c','#0e6655','#2ecc71','#a8e6cf'],
            accent:'#2ecc71',accentAlt:'#1abc9c',text:'#d5f5e3',
            card:'rgba(10,22,40,0.55)',cardHover:'rgba(46,204,113,0.15)',
            border:'rgba(46,204,113,0.2)',particle:'rgba(168,230,207,1)',
            birdColor:'#0a1628',mtn1:'rgba(10,22,40,0.85)',mtn2:'rgba(15,43,60,0.55)',mtn3:'rgba(14,102,85,0.2)',
            glow:'rgba(46,204,113,0.15)',icon:'fa-cloud-sun',temp:'18°C',desc:'Crisp morning air',showStars:false,showClouds:true
        },
        afternoon: {
            sky:['#1a0800','#5c1a00','#d97706','#f59e0b','#fde68a'],
            accent:'#f59e0b',accentAlt:'#d97706',text:'#fef3c7',
            card:'rgba(26,8,0,0.5)',cardHover:'rgba(245,158,11,0.15)',
            border:'rgba(245,158,11,0.2)',particle:'rgba(253,230,138,1)',
            birdColor:'#5c1a00',mtn1:'rgba(26,8,0,0.75)',mtn2:'rgba(92,26,0,0.45)',mtn3:'rgba(217,119,6,0.2)',
            glow:'rgba(245,158,11,0.15)',icon:'fa-sun',temp:'28°C',desc:'Warm golden afternoon',showStars:false,showClouds:false
        },
        evening: {
            sky:['#0a0010','#3d0c02','#b91c1c','#ea580c','#fb923c'],
            accent:'#ef4444',accentAlt:'#f97316',text:'#fca5a5',
            card:'rgba(10,0,16,0.55)',cardHover:'rgba(239,68,68,0.15)',
            border:'rgba(239,68,68,0.2)',particle:'rgba(251,146,60,1)',
            birdColor:'#3d0c02',mtn1:'rgba(10,0,16,0.85)',mtn2:'rgba(61,12,2,0.5)',mtn3:'rgba(185,28,28,0.2)',
            glow:'rgba(239,68,68,0.15)',icon:'fa-cloud-moon',temp:'22°C',desc:'Crimson sunset glow',showStars:false,showClouds:true
        },
        night: {
            sky:['#000810','#001219','#005f73','#0a9396','#94d2bd'],
            accent:'#00ffb3',accentAlt:'#0a9396',text:'#94d2bd',
            card:'rgba(0,8,16,0.7)',cardHover:'rgba(0,255,179,0.1)',
            border:'rgba(0,255,179,0.15)',particle:'rgba(0,255,179,1)',
            birdColor:'#001219',mtn1:'rgba(0,8,16,0.95)',mtn2:'rgba(0,18,25,0.7)',mtn3:'rgba(0,95,115,0.2)',
            glow:'rgba(0,255,179,0.15)',icon:'fa-moon',temp:'8°C',desc:'Starry digital night',showStars:true,showClouds:false
        }
    };

    let currentPeriod = null, manualOverride = false;

    function detectTimePeriod() {
        const h = new Date().getHours();
        if (h>=5&&h<7) return 'dawn';
        if (h>=7&&h<11) return 'morning';
        if (h>=11&&h<17) return 'afternoon';
        if (h>=17&&h<20) return 'evening';
        return 'night';
    }

    function applyTheme(period) {
        const t = themes[period]; if (!t) return;
        currentPeriod = period;
        const r = document.documentElement.style;
        r.setProperty('--sky-0',t.sky[0]);r.setProperty('--sky-1',t.sky[1]);
        r.setProperty('--sky-2',t.sky[2]);r.setProperty('--sky-3',t.sky[3]);r.setProperty('--sky-4',t.sky[4]);
        r.setProperty('--accent',t.accent);r.setProperty('--accent-alt',t.accentAlt);
        r.setProperty('--text',t.text);r.setProperty('--card',t.card);
        r.setProperty('--card-hover',t.cardHover);r.setProperty('--border',t.border);
        r.setProperty('--particle',t.particle);r.setProperty('--bird-color',t.birdColor);
        r.setProperty('--mtn1',t.mtn1);r.setProperty('--mtn2',t.mtn2);r.setProperty('--mtn3',t.mtn3);
        r.setProperty('--glow',t.glow);
        document.getElementById('stars-layer').style.opacity = t.showStars?'1':'0';
        document.getElementById('clouds-layer').style.opacity = t.showClouds?'1':'0';
        document.getElementById('weather-icon').className = `fas ${t.icon}`;
        document.getElementById('badge-temp').textContent = t.temp;
        document.getElementById('badge-desc').textContent = t.desc;
        document.querySelectorAll('.bird-fly svg path').forEach(p=>p.setAttribute('fill',t.birdColor));
        document.querySelectorAll('.time-btn').forEach(b=>b.classList.toggle('active',b.dataset.period===period));
    }

    /* ===================== STARS ===================== */
    function createStars() {
        const c = document.getElementById('stars-layer');
        for (let i=0;i<120;i++){
            const s=document.createElement('div');s.className='star';
            s.style.left=`${Math.random()*100}%`;s.style.top=`${Math.random()*55}%`;
            const sz=1+Math.random()*2;s.style.width=s.style.height=`${sz}px`;
            s.style.setProperty('--dur',`${2+Math.random()*3}s`);
            s.style.setProperty('--delay',`${Math.random()*4}s`);
            c.appendChild(s);
        }
        for (let i=0;i<2;i++){
            const ss=document.createElement('div');ss.className='shooting-star';
            ss.style.top=`${5+Math.random()*25}%`;ss.style.left=`${40+Math.random()*40}%`;
            ss.style.animationDelay=`${i*6+Math.random()*4}s`;ss.style.animationDuration=`${5+Math.random()*4}s`;
            c.appendChild(ss);
        }
    }

    /* ===================== CLOUDS ===================== */
    function createClouds() {
        const c=document.getElementById('clouds-layer');
        for (let i=0;i<5;i++){
            const cloud=document.createElement('div');cloud.className='cloud';
            cloud.style.top=`${5+Math.random()*35}%`;
            cloud.style.animationDuration=`${40+Math.random()*40}s`;
            cloud.style.animationDelay=`${-Math.random()*40}s`;
            cloud.style.opacity=.15+Math.random()*.15;
            const w=150+Math.random()*200;
            cloud.innerHTML=`<svg viewBox="0 0 ${w} 80" width="${w}" height="${w*0.25}">
                <ellipse cx="${w*.3}" cy="50" rx="${w*.22}" ry="22" fill="white" opacity=".6"/>
                <ellipse cx="${w*.5}" cy="38" rx="${w*.28}" ry="28" fill="white" opacity=".8"/>
                <ellipse cx="${w*.72}" cy="48" rx="${w*.2}" ry="20" fill="white" opacity=".6"/>
            </svg>`;
            c.appendChild(cloud);
        }
    }

    /* ===================== BIRDS ===================== */
    function createBirds() {
        const layer=document.getElementById('birds-layer');
        for (let i=0;i<9;i++){
            const container=document.createElement('div');container.className='bird-fly';
            container.style.top=`${8+Math.random()*35}%`;
            container.style.animationDuration=`${14+Math.random()*22}s`;
            container.style.animationDelay=`${-Math.random()*22}s`;
            container.style.opacity=.25+Math.random()*.45;
            const scale=.4+Math.random()*.9;container.style.transform=`scale(${scale})`;
            const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
            svg.setAttribute('viewBox','0 0 40 14');svg.setAttribute('width','40');svg.setAttribute('height','14');
            svg.classList.add('bird-flap');
            svg.style.animationDuration=`${.25+Math.random()*.35}s`;
            svg.style.animationDelay=`${Math.random()*.3}s`;
            const path=document.createElementNS('http://www.w3.org/2000/svg','path');
            path.setAttribute('d','M20,7 Q13,0 1,5 Q12,6 20,7 Q28,6 39,5 Q27,0 20,7Z');
            path.setAttribute('fill','var(--bird-color)');
            svg.appendChild(path);container.appendChild(svg);layer.appendChild(container);
        }
    }

    /* ===================== PARTICLES ===================== */
    const canvas=document.getElementById('particle-canvas');
    const ctx=canvas.getContext('2d');
    let particles=[], raindrops=[];

    function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}

    class Particle{
        constructor(){this.reset(true);}
        reset(init){
            this.x=Math.random()*canvas.width;
            this.y=init?Math.random()*canvas.height:canvas.height+10;
            this.size=Math.max(0.5,Math.random()*2.5);
            this.vx=(Math.random()-.5)*.4;
            this.vy=-(Math.random()*.6+.15);
            this.baseAlpha=Math.random()*.5+.15;
            this.phase=Math.random()*Math.PI*2;
        }
        update(){
            this.x+=this.vx;this.y+=this.vy;this.phase+=.025;
            if(this.y<-10||this.x<-10||this.x>canvas.width+10) this.reset(false);
        }
        draw(){
            const alpha=this.baseAlpha*(.4+.6*Math.sin(this.phase));
            const col=getComputedStyle(document.documentElement).getPropertyValue('--particle').trim();
            const m=col.match(/(\d+),\s*(\d+),\s*(\d+)/);
            if(!m) return;
            ctx.fillStyle=`rgba(${m[1]},${m[2]},${m[3]},${alpha})`;
            ctx.beginPath();ctx.arc(this.x,this.y,Math.max(.3,this.size),0,Math.PI*2);ctx.fill();
            if(this.size>1.5){
                ctx.fillStyle=`rgba(${m[1]},${m[2]},${m[3]},${alpha*.2})`;
                ctx.beginPath();ctx.arc(this.x,this.y,Math.max(.5,this.size*3),0,Math.PI*2);ctx.fill();
            }
        }
    }

    class RainDrop{
        constructor(){this.reset();}
        reset(){this.x=Math.random()*canvas.width;this.y=-20;this.len=12+Math.random()*25;this.speed=10+Math.random()*10;this.alpha=.08+Math.random()*.18;this.wind=1.5;}
        update(){this.y+=this.speed;this.x+=this.wind;if(this.y>canvas.height+30) this.reset();}
        draw(){
            const col=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
            const m=col.match(/(\d+),\s*(\d+),\s*(\d+)/);
            if(!m) return;
            ctx.strokeStyle=`rgba(${m[1]},${m[2]},${m[3]},${this.alpha})`;
            ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x+this.wind*2,this.y-this.len);ctx.stroke();
        }
    }

    function initParticles(){particles=[];for(let i=0;i<60;i++) particles.push(new Particle());}

    let isRaining=false;
    function setRain(on){
        isRaining=on;
        if(on&&raindrops.length===0){for(let i=0;i<120;i++) raindrops.push(new RainDrop());}
        else if(!on) raindrops=[];
    }

    function animateParticles(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p=>{p.update();p.draw();});
        if(isRaining) raindrops.forEach(r=>{r.update();r.draw();});
        requestAnimationFrame(animateParticles);
    }

    /* ===================== PARALLAX ===================== */
    const mtn1=document.getElementById('mtn1'),mtn2=document.getElementById('mtn2'),mtn3=document.getElementById('mtn3');
    const birdsLayer=document.getElementById('birds-layer'),starsLayer=document.getElementById('stars-layer');
    let scrollY=0,mouseX=0,mouseY=0,targetMX=0,targetMY=0;

    window.addEventListener('scroll',()=>{scrollY=window.scrollY;},{passive:true});
    document.addEventListener('mousemove',(e)=>{targetMX=(e.clientX/window.innerWidth-.5)*2;targetMY=(e.clientY/window.innerHeight-.5)*2;},{passive:true});

    function updateParallax(){
        mouseX+=(targetMX-mouseX)*.05;mouseY+=(targetMY-mouseY)*.05;
        mtn1.style.transform=`translateY(${-scrollY*.15}px) translateX(${mouseX*8}px)`;
        mtn2.style.transform=`translateY(${-scrollY*.3}px) translateX(${mouseX*14}px)`;
        mtn3.style.transform=`translateY(${-scrollY*.45}px) translateX(${mouseX*20}px)`;
        birdsLayer.style.transform=`translateY(${-scrollY*.08}px) translateX(${mouseX*5}px)`;
        starsLayer.style.transform=`translateY(${-scrollY*.05}px) translateX(${mouseX*3}px)`;
        requestAnimationFrame(updateParallax);
    }

    /* ===================== PREVIEW FETCHER ===================== */
    const previewCache = new Map();

    async function fetchPreview(url) {
        if (previewCache.has(url)) return previewCache.get(url);
        try {
            // Use r.jina.ai to get a readable summary of the page
            const res = await fetch(`https://r.jina.ai/${url}`, {
                headers: { 'Accept': 'text/plain', 'X-Return-Format': 'text' }
            });
            if (!res.ok) throw new Error('Failed');
            const text = await res.text();
            // Clean up: take first ~500 chars of meaningful content
            const lines = text.split('\n').filter(l => l.trim().length > 20);
            const summary = lines.slice(0, 6).join(' ').substring(0, 600);
            const result = { text: summary || 'No preview available for this page.', image: null };
            previewCache.set(url, result);
            return result;
        } catch (e) {
            const result = { text: 'Could not load a preview for this story. Click the link below to read it directly.', image: null };
            previewCache.set(url, result);
            return result;
        }
    }

    // Try to get an OG image via a small proxy trick
    function guessImageUrl(url, title) {
        // For well-known domains, construct likely image paths
        try {
            const u = new URL(url);
            const host = u.hostname;
            // GitHub repos
            if (host.includes('github.com')) {
                const parts = u.pathname.split('/').filter(Boolean);
                if (parts.length >= 2) return `https://opengraph.githubassets.com/1/${parts[0]}/${parts[1]}`;
            }
        } catch(e) {}
        return null;
    }

    /* ===================== HACKER NEWS API ===================== */
    function getDomain(url){if(!url) return 'ycombinator.com';try{return new URL(url).hostname.replace('www.','');}catch{return 'ycombinator.com';}}
    function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60) return 'just now';const m=Math.floor(s/60);if(m<60) return `${m}m ago`;const h=Math.floor(m/60);if(h<24) return `${h}h ago`;return `${Math.floor(h/24)}d ago`;}

    function showSkeletons(count){
        const c=document.getElementById('stories-container');let html='';
        for(let i=0;i<count;i++){
            html+=`<div class="skeleton-card">
                <div class="skel-bar" style="width:2.5rem;height:1.2rem;flex-shrink:0;"></div>
                <div style="flex:1;">
                    <div class="skel-bar" style="width:${60+Math.random()*35}%;height:1rem;margin-bottom:.6rem;"></div>
                    <div class="skel-bar" style="width:${30+Math.random()*40}%;height:.7rem;"></div>
                </div>
            </div>`;
        }
        c.innerHTML=html;
    }

    function renderStories(stories) {
        const c=document.getElementById('stories-container');c.innerHTML='';
        stories.forEach((story,i)=>{
            if(!story||!story.title) return;
            const card=document.createElement('article');
            card.className='story-card';card.dataset.id=story.id;
            card.setAttribute('tabindex','0');
            card.setAttribute('aria-label',story.title);
            const rank=String(i+1).padStart(2,'0');
            const domain=getDomain(story.url);
            const href=story.url||`https://news.ycombinator.com/item?id=${story.id}`;
            card.innerHTML=`
                <div class="story-header">
                    <div class="story-rank">${rank}</div>
                    <div class="story-body">
                        <div class="story-title-text">${story.title}</div>
                        <div class="story-meta">
                            <span class="story-domain">${domain}</span>
                            <span><i class="fas fa-arrow-up"></i>${story.score||0}</span>
                            <span><i class="fas fa-comment"></i>${story.descendants||0}</span>
                            <span><i class="fas fa-clock"></i>${timeAgo(story.time*1000)}</span>
                            <span>by ${story.by}</span>
                        </div>
                    </div>
                    <div class="story-expand-icon"><i class="fas fa-chevron-down"></i></div>
                </div>
                <div class="expand-divider"></div>
                <div class="story-expanded">
                    <div class="story-expanded-inner" data-url="${encodeURIComponent(href)}">
                        <div class="story-preview-loading"><div class="spinner"></div> Loading preview...</div>
                    </div>
                </div>`;

            // Toggle expand on click (but not on the visit button)
            card.querySelector('.story-header').addEventListener('click', (e) => {
                if (e.target.closest('.story-visit-btn')) return;
                const wasExpanded = card.classList.contains('expanded');
                // Collapse all others
                document.querySelectorAll('.story-card.expanded').forEach(c2 => {
                    if (c2 !== card) c2.classList.remove('expanded');
                });
                card.classList.toggle('expanded');
                if (!wasExpanded) loadPreview(card, href);
            });

            // Keyboard support
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    card.querySelector('.story-header').click();
                }
            });

            c.appendChild(card);
        });
        observeCards();
    }

    async function loadPreview(card, url) {
        const inner = card.querySelector('.story-expanded-inner');
        // Check if already loaded
        if (inner.dataset.loaded === 'true') return;
        inner.dataset.loaded = 'true';

        const preview = await fetchPreview(url);
        const guessedImg = guessImageUrl(url, '');
        const hasImage = guessedImg;

        let imageHtml = '';
        if (hasImage) {
            imageHtml = `<div class="story-image-wrap">
                <img src="${guessedImg}" alt="Story preview" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'story-image-placeholder\\'><i class=\\'fas fa-newspaper\\'></i><span>No image</span></div>'"/>
            </div>`;
        } else {
            imageHtml = `<div class="story-image-wrap">
                <div class="story-image-placeholder"><i class="fas fa-newspaper"></i><span>No image available</span></div>
            </div>`;
        }

        inner.innerHTML = `
            ${imageHtml}
            <div class="story-preview-text">
                <p>${preview.text}</p>
                <a class="story-visit-btn" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation();">
                    Read full story <i class="fas fa-arrow-right"></i>
                </a>
            </div>`;
    }

    function observeCards(){
        const observer=new IntersectionObserver((entries)=>{
            entries.forEach(entry=>{
                if(entry.isIntersecting){
                    const idx=Array.from(entry.target.parentNode.children).indexOf(entry.target);
                    entry.target.style.transitionDelay=`${idx*.04}s`;
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        },{threshold:.08,rootMargin:'0px 0px -40px 0px'});
        document.querySelectorAll('.story-card').forEach(c=>observer.observe(c));
    }

    async function fetchStories(){
        showSkeletons(15);
        try{
            const res=await fetch('https://hacker-news.firebaseio.com/v0/topstories.json');
            const ids=await res.json();
            const top30=ids.slice(0,30);
            const stories=await Promise.all(top30.map(id=>fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r=>r.json()).catch(()=>null)));
            renderStories(stories.filter(Boolean));
            showToast(`Loaded ${stories.filter(Boolean).length} stories`);
        }catch(err){
            document.getElementById('stories-container').innerHTML=`
                <div style="text-align:center;padding:3rem;opacity:.5;">
                    <i class="fas fa-wifi" style="font-size:2rem;margin-bottom:1rem;display:block;"></i>
                    <p>Failed to fetch stories. Check your connection.</p>
                    <button onclick="fetchStories()" style="margin-top:1rem;padding:.6rem 1.5rem;border-radius:100px;border:1px solid var(--border);background:var(--card);color:var(--accent);cursor:pointer;font-family:inherit;">Retry</button>
                </div>`;
        }
    }

    /* ===================== TOAST ===================== */
    let toastTimer;
    function showToast(msg){
        const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
        clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
    }

    /* ===================== TIME SWITCHER ===================== */
    document.querySelectorAll('.time-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
            manualOverride=true;
            applyTheme(btn.dataset.period);
            setRain(btn.dataset.period==='dawn');
            showToast(`Switched to ${btn.dataset.period}`);
        });
    });

    /* ===================== CLOCK ===================== */
    function updateClock(){
        const now=new Date();
        document.getElementById('badge-time').textContent=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    /* ===================== WEATHER CHECK ===================== */
    function updateWeather(){
        if(manualOverride) return;
        const period=detectTimePeriod();
        if(period!==currentPeriod){applyTheme(period);setRain(period==='dawn');}
    }

    /* ===================== INIT ===================== */
    function init(){
        resizeCanvas();
        window.addEventListener('resize',resizeCanvas);
        createStars();createClouds();createBirds();initParticles();
        const period=detectTimePeriod();
        applyTheme(period);setRain(period==='dawn');
        animateParticles();updateParallax();
        fetchStories();
        updateClock();
        setInterval(updateClock,10000);
        setInterval(updateWeather,60000);
        setInterval(fetchStories,300000);
    }

    document.addEventListener('DOMContentLoaded',init);
    </script>
</body>
</html>
